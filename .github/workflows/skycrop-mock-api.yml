name: Build and deploy SkyCrop Mock API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - name: Install and check application
        run: |
          npm ci
          node --check server.js
          node --check mock-api-server.js
          node --check mock-api-server-config.js
          npm run build --if-present
          npm run test --if-present
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: skycrop-mock-api
          include-hidden-files: true
          path: |
            *.js
            package*.json
            db.json

  deploy:
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skycrop-mock-api
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy SkyCrop Mock API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: .
